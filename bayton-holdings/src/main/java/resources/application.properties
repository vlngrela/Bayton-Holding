# ============================================================================
# Bayton Grupo Empresario - configuracion principal (MySQL local)
# ============================================================================

# Nombre de la aplicacion (aparece en los logs).
spring.application.name=bayton-holdings

# --- Servidor web ---
# Puerto HTTP. La aplicacion queda en http://localhost:8080
server.port=8080

# --- Vaadin ---
# false: no abre el navegador solo al arrancar; hay que entrar a mano a la URL.
vaadin.launch-browser=false

# --- Base de datos MySQL ---
# URL de conexion. Base "bayton_holding" en el MySQL local (puerto 3306).
#   createDatabaseIfNotExist=true     crea la base si todavia no existe
#   sslMode=DISABLED                  sin SSL (conexion local)
#   allowPublicKeyRetrieval=true      necesario con el login por defecto de MySQL 8
# Cada valor puede sobreescribirse con una variable de entorno (DB_URL, DB_USERNAME,
# DB_PASSWORD) para no dejar credenciales en el repositorio.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bayton_holding?createDatabaseIfNotExist=true&sslMode=DISABLED&allowPublicKeyRetrieval=true}
# Usuario de MySQL (por defecto root).
spring.datasource.username=${DB_USERNAME:root}
# Clave de MySQL. Por defecto vacia: definir DB_PASSWORD si tu root tiene clave.
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# update: Hibernate crea las tablas que faltan y agrega columnas nuevas a partir de las
# entidades, sin borrar datos. Suficiente para el TP (en produccion se usaria Flyway).
spring.jpa.hibernate.ddl-auto=update
# Dialecto de Hibernate para MySQL. Hibernate lo detecta solo, asi que es opcional: al
# arrancar puede mostrar un aviso (HHH90000025) diciendo que no hace falta; es inofensivo.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# true: imprime en consola cada sentencia SQL que ejecuta Hibernate (util para el TP).
spring.jpa.show-sql=true
# true: imprime el SQL con saltos de linea e indentacion para que se pueda leer.
spring.jpa.properties.hibernate.format_sql=true
# false: no mantiene la sesion de Hibernate abierta durante toda la peticion web.
# Imprescindible con Vaadin: las vistas reciben DTOs, no entidades con carga perezosa.
spring.jpa.open-in-view=false

# --- Scripts SQL ---
# never: Spring Boot NO ejecuta schema.sql/data.sql automaticamente. Los de db/ son de
# carga manual; las tablas las crea Hibernate y los datos iniciales, DataInitializer.
spring.sql.init.mode=never

# --- Consola H2 ---
# La base real es MySQL; la consola de H2 (solo para tests) queda apagada.
spring.h2.console.enabled=false

# --- Datos iniciales ---
# true: DataInitializer crea los usuarios de prueba si la tabla usuario esta vacia.
# Ponerlo en false para desactivarlo (por ejemplo, en un despliegue real).
bayton.datos-iniciales.habilitado=true
